<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEIDEI-CardGame — プレビュー</title>
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f4f4f4;
      color: #111;
      line-height: 1.5;
    }
    main {
      max-width: 640px;
      margin: 48px auto;
      padding: 0 20px;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #555; font-size: 14px; }
    .links { display: grid; gap: 12px; margin-top: 24px; }
    a.card {
      display: block;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px 18px;
      text-decoration: none;
      color: inherit;
    }
    a.card:hover { border-color: #222; }
    a.card strong { display: block; font-size: 16px; margin-bottom: 4px; }
    a.card span { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <main>
    <h1>DEIDEI-CardGame プレビュー</h1>
    <p>操作イメージのワイヤーと、画面遷移ボードをブラウザで開けます。</p>
    <div class="links">
      <a class="card" href="./wireframes/index.html">
        <strong>操作プレビュー（ワイヤーフレーム）</strong>
        <span>画面を切り替えて操作イメージを確認</span>
      </a>
      <a class="card" href="./wireframes/screen-flow.html">
        <strong>画面遷移ボード</strong>
        <span>キャプチャ付きの遷移図（クリックで各画面へ）</span>
      </a>
    </div>
  </main>
</body>
</html>
